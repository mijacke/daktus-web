# Statický build Nuxt 4. Na Netlify CI Nitro auto-detekuje prostredie (netlify preset)
# a výstup píše do dist; lokálne nuxt generate vytvára dist ako symlink na .output/public.
# Verzia Node sa berie z .nvmrc.
[build]
  command = "npm run generate"
  publish = "dist"

# Neznáme cesty dostanú plne prerenderovanú 404 stránku (existujúce súbory majú prednosť)
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
